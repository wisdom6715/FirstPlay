<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FirstPlay — African Web Games & Digital Experiences</title>
    <meta name="description" content="Discover and play curated Nigerian and African browser games, web apps, and digital products instantly with zero installation." />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FirstPlay" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      window.__firstplay_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__firstplay_deferred_prompt = e;
        window.dispatchEvent(new CustomEvent('firstplay:pwa-prompt-available', { detail: e }));
        console.info('[FirstPlay PWA] Native install prompt captured and ready.');
      });
      window.addEventListener('appinstalled', function() {
        window.__firstplay_deferred_prompt = null;
        console.info('[FirstPlay PWA] Application was successfully installed.');
      });

      // Register PWA service worker early so Chrome immediately satisfies PWA install criteria
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.info('[FirstPlay PWA] Service Worker active:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[FirstPlay PWA] Service Worker registration failed:', err);
          });
      }
    </script>
  </head>
  <body class="bg-[#f5f5f7] text-[#1d1d1f] antialiased select-none overflow-hidden m-0 p-0 font-sans">
    <div id="root" class="h-screen w-screen flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
